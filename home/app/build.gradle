plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kartikmodi.halo.home'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.kartikmodi.halo.home')
        // Lowered from 26 for Xiaomi MiTV3S (pulpfiction, Android 6.0.1 / API 23). java.time is back-ported
        // to API 21 by core library desugaring, see compileOptions below.
        minSdk 23
        targetSdk 34
        versionCode 12
        versionName '3.2'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.time (API 26) is used by RaceWeekend, Festival, ViewingTime and MainActivity; desugaring
        // makes those calls work on API 21+.
        coreLibraryDesugaringEnabled true
    }

    lint {
        // NewApi findings are expected on the API 23 back-port and must be reviewed by hand, not gate the build.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // ResourcesCompat.getFont back-ports Resources#getFont (API 26) to the API 23 firmware; see Compat.java.
    implementation 'androidx.core:core:1.13.1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
