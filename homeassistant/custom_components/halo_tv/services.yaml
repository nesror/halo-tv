# Describes halo_tv.command to the Home Assistant UI (Developer tools -> Actions).
command:
  name: Send a command
  description: >-
    Tell a Halo TV to do one thing: pause, play, go dark, light up, open Ambient,
    read something out loud, or show a message.
  fields:
    action:
      name: Command
      description: >-
        pause, play, play_pause, stop, next, prev, screen_off, screen_on,
        screen_toggle, home, ambient, dismiss, say, stop_speech, volume_set,
        volume_up, volume_down, mute, unmute, notify, viewing_reset,
        viewing_off or viewing_on.
      required: true
      example: screen_off
      selector:
        select:
          options:
            - pause
            - play
            - play_pause
            - stop
            - next
            - prev
            - screen_off
            - screen_on
            - screen_toggle
            - home
            - ambient
            - dismiss
            - say
            - stop_speech
            - volume_set
            - volume_up
            - volume_down
            - mute
            - unmute
            - notify
            - viewing_reset
            - viewing_off
            - viewing_on
    text:
      name: Text
      description: For "say" - the words to read out.
      example: Dinner is ready
      selector:
        text:
    message:
      name: Message
      description: For "notify" - the line of text to put on the screen.
      example: Someone is at the door
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: For "notify" - the small heading above the message.
      example: Doorbell
      selector:
        text:
    image:
      name: Image
      description: >-
        For "notify" - a picture to show, as an http(s) address or a data: URI.
      example: http://homeassistant.local:8123/local/doorbell.jpg
      selector:
        text:
    language:
      name: Language
      description: >-
        For "say" and a spoken "notify" - a language tag such as en-GB or zh-CN.
        Empty uses the TV's own language.
      example: en-GB
      selector:
        text:
    duration:
      name: Duration
      description: >-
        For "notify" - seconds on screen. 0 leaves the message up until it is dismissed.
      default: 12
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    tts:
      name: Read aloud
      description: For "notify" - also speak the message.
      default: false
      selector:
        boolean:
    volume:
      name: Volume
      description: For "volume_set" - 0 to 100.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    level:
      name: Volume level
      description: For "volume_set" - 0 to 1, the way Home Assistant usually means volume.
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
